version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: flyff-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flyff
    ports:
      - "5432:5432"
    volumes:
      - flyff-pgdata:/var/lib/postgresql/data
      - ./packages/server-core/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flyff-pgdata:
